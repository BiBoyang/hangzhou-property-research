# 25 题验收集：每次 pipeline 调整后跑一遍，人工/半自动核对
# 评分口径：expect 里的关键词命中即可，注意同义表达（"下降16%" ≈ "-16%"）
questions:
  # —— 数据定位类 ——
  - q: "2026年3月杭州百城价格指数环比涨跌多少？样本均价多少？"
    expect: ["0.34%", "33592"]
  - q: "2026年4月杭州市区二手房成交多少套？"
    expect: ["9968"]
  - q: "高盛2026年4月16日地产月报对一线城市房价环比的判断是什么？"
    expect: ["+0.2%", "+0.4%"]
  - q: "2026年一季度中国GDP增速，野村/高盛/瑞银的点评口径分别是什么？"
    expect: ["超预期"]
  - q: "中指院2026年3月百城报告中，样本价格中位数最高的城市是哪个？"
    expect: []
  # —— 观点对比类 ——
  - q: "各机构对上海房价底部时点的判断分别是什么？"
    expect: ["J.P. Morgan", "Goldman Sachs"]
  - q: "高盛和瑞银对2026年一线城市房价的判断有何异同？"
    expect: []
  - q: "瑞银对中国楼市的态度在2026年上半年发生了什么变化？"
    expect: ["购房意愿", "改善"]
  - q: "摩根大通访谈冰山指数专家后，对全国房价触底的判断是什么？"
    expect: ["2027", "9%"]
  - q: "瑞银公积金报告认为11万亿公积金如何稳定市场？"
    expect: ["公积金"]
  # —— 政策与宏观类 ——
  - q: "2026年8月北京楼市新政的主要内容是什么？各机构怎么评价？"
    expect: ["北京"]
  - q: "2026年4月政治局会议对房地产的定调是什么？"
    expect: []
  - q: "摩根大通认为北京8月新政为什么效果有限？"
    expect: []
  - q: "高盛认为香港楼市企稳对内地一线城市有什么借鉴？"
    expect: ["香港"]
  - q: "公积金贷款利率后续还有下调空间吗？瑞银怎么说？"
    expect: ["公积金"]
  # —— 杭州本地类 ——
  - q: "杭州2026年8月新房成交均价多少？同比环比分别多少？"
    expect: ["40924", "下降16%", "上涨15%"]
  - q: "杭州2026年上半年土地市场成交金额和排名？"
    expect: ["481", "第二"]
  - q: "杭州二手房2026年3月到8月的成交量走势？"
    expect: ["9356", "9968", "9087", "7711", "7107", "6337"]
  - q: "杭州目前新房库存去化周期多少个月？"
    expect: ["8.5"]
  - q: "杭州8月土地溢价率多少？说明什么？"
    expect: ["10%"]
  # —— 边界类（考"不知道就说不知道"）——
  - q: "2026年9月杭州二手房成交多少套？"
    expect: ["未覆盖"]
  - q: "成都在这些研报里的房价数据？"
    expect: ["未覆盖"]
  - q: "2027年杭州房价会涨多少？"
    expect: ["预测"]
  - q: "高盛对长鑫存储的目标价是多少？"  # 不在语料库（频道有视频但无研报PDF）
    expect: ["未覆盖"]
  - q: "大摩2026年5月18日报告标题里的Inflection指的是什么？"
    expect: []
