<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>房地产研报研判 · 问答</title>
<style>
  body{font-family:-apple-system,"PingFang SC",sans-serif;max-width:900px;margin:0 auto;padding:16px;color:#222}
  nav a{margin-right:16px;color:#2563eb;text-decoration:none}
  #q{width:100%;padding:10px;font-size:16px;box-sizing:border-box}
  button{padding:10px 24px;font-size:16px;background:#2563eb;color:#fff;border:0;border-radius:6px;cursor:pointer}
  #warmbar{background:#fef9c3;border:1px solid #fde047;color:#854d0e;padding:10px 14px;border-radius:8px;margin-top:12px;font-size:14px}
  #answer{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:16px;margin-top:16px;line-height:1.7}
  #answer h1,#answer h2,#answer h3,#answer h4{margin:14px 0 8px;line-height:1.4;color:#0f172a}
  #answer h1{font-size:20px}#answer h2{font-size:18px}#answer h3{font-size:16px}#answer h4{font-size:15px}
  #answer p{margin:8px 0}
  #answer table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
  #answer th,#answer td{border:1px solid #cbd5e1;padding:6px 10px;text-align:left}
  #answer th{background:#eef2f7}
  #answer tbody tr:nth-child(even){background:#f8fafc}
  #answer blockquote{border-left:3px solid #cbd5e1;margin:8px 0;padding:4px 12px;color:#475569;background:#f8fafc}
  #answer ul,#answer ol{margin:8px 0;padding-left:24px}
  #answer li{margin:4px 0}
  #answer code{background:#eef2f7;padding:1px 5px;border-radius:4px;font-size:13px}
  #answer pre{background:#1e293b;color:#e2e8f0;padding:12px;border-radius:8px;overflow-x:auto}
  #answer pre code{background:none;color:inherit;padding:0}
  .src{border-left:3px solid #cbd5e1;padding:8px 12px;margin:8px 0;font-size:13px;color:#475569}
  .src b{color:#0f172a}
</style>
</head>
<body>
<nav><a href="/">问答</a><a href="/overview">总览</a><a href="/metrics">指标看板</a><a href="/docs">报告库</a></nav>
<h2>研报问答</h2>
<div id="warmbar" hidden>服务预热中：模型首次加载约需 30 秒，加载完成后此提示自动消失。</div>
<form id="f">
  <input id="q" placeholder="例：各机构对上海房价底部的判断分别是什么？" autofocus>
  <p><button type="submit">提问</button></p>
</form>
<div id="status" style="color:#64748b;font-size:14px;margin-top:8px"></div>
<div id="answer" hidden></div>
<div id="sources"></div>
<script src="/static/marked.min.js"></script>
<script src="/static/purify.min.js"></script>
<script>
// 回答正文走 marked + DOMPurify；数据库来源字段（机构/标题/标题/正文）一律 esc 后再进 innerHTML
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const renderMd = (t) => DOMPurify.sanitize(marked.parse(t));

const warmbar = document.getElementById('warmbar');
(async () => {
  while (true) {
    try {
      const r = await fetch('/api/health');
      if ((await r.json()).warm) { warmbar.hidden = true; return; }
      warmbar.hidden = false;
    } catch (e) { /* 服务暂不可达，继续轮询 */ }
    await new Promise(res => setTimeout(res, 2000));
  }
})();

document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  const ans = document.getElementById('answer');
  const status = document.getElementById('status');
  let acc = '';
  ans.hidden = false; ans.innerHTML = '';
  status.textContent = '开始…';
  document.getElementById('sources').innerHTML = '';
  const r = await fetch('/api/ask/stream?q=' + encodeURIComponent(q), {method: 'POST'});
  const reader = r.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  while (true) {
    const {done, value} = await reader.read();
    if (done) break;
    buf += dec.decode(value, {stream: true});
    const lines = buf.split('\n');
    buf = lines.pop();
    for (const line of lines) {
      if (!line.trim()) continue;
      const ev = JSON.parse(line);
      if (ev.stage) status.textContent = ev.stage;
      if (ev.delta) { acc += ev.delta; ans.innerHTML = renderMd(acc); }
      if (ev.done) {
        status.textContent = '完成';
        ans.innerHTML = renderMd(ev.answer || acc);
        document.getElementById('sources').innerHTML = (ev.sources || []).map(s =>
          `<div class="src"><b>${esc(s.institution)} ${esc(s.date)}</b> 《${esc(s.title)}》 ${esc(s.heading)}<br>${esc(s.text)}…</div>`
        ).join('');
      }
    }
  }
};
</script>
</body>
</html>
