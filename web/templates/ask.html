<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>房地产研报研判 · 问答</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<nav class="topnav"><div class="topnav-in">
  <a class="logo" href="/">研报研判</a>
  <div class="navlinks">
    <a href="/" class="on" aria-current="page">问答</a>
    <a href="/overview">总览</a>
    <a href="/metrics">指标看板</a>
    <a href="/docs">报告库</a>
  </div>
</div></nav>
<main class="page page-ask">
<header class="hero">
  <h2>研报问答</h2>
</header>
<div id="warmbar" hidden>服务预热中：模型首次加载约需 30 秒，加载完成后此提示自动消失。</div>
<form id="f">
  <input id="q" placeholder="例：各机构对上海房价底部的判断分别是什么？" autofocus>
  <p><button type="submit">提问</button></p>
</form>
<div id="status" class="dim"></div>
<div id="answer" hidden></div>
<div id="sources"></div>
</main>
<script src="/static/marked.min.js"></script>
<script src="/static/purify.min.js"></script>
<script>
// 回答正文走 marked + DOMPurify；数据库来源字段（机构/标题/标题/正文）一律 esc 后再进 innerHTML
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const renderMd = (t) => DOMPurify.sanitize(marked.parse(t));

const warmbar = document.getElementById('warmbar');
(async () => {
  while (true) {
    try {
      const r = await fetch('/api/health');
      if ((await r.json()).warm) { warmbar.hidden = true; return; }
      warmbar.hidden = false;
    } catch (e) { /* 服务暂不可达，继续轮询 */ }
    await new Promise(res => setTimeout(res, 2000));
  }
})();

document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  const ans = document.getElementById('answer');
  const status = document.getElementById('status');
  let acc = '';
  ans.hidden = false; ans.innerHTML = '';
  status.textContent = '开始…';
  document.getElementById('sources').innerHTML = '';
  const r = await fetch('/api/ask/stream?q=' + encodeURIComponent(q), {method: 'POST'});
  const reader = r.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  while (true) {
    const {done, value} = await reader.read();
    if (done) break;
    buf += dec.decode(value, {stream: true});
    const lines = buf.split('\n');
    buf = lines.pop();
    for (const line of lines) {
      if (!line.trim()) continue;
      const ev = JSON.parse(line);
      if (ev.stage) status.textContent = ev.stage;
      if (ev.delta) { acc += ev.delta; ans.innerHTML = renderMd(acc); }
      if (ev.done) {
        status.textContent = '完成';
        ans.innerHTML = renderMd(ev.answer || acc);
        document.getElementById('sources').innerHTML = (ev.sources || []).map(s =>
          `<div class="src"><b>${esc(s.institution)} ${esc(s.date)}</b> 《${esc(s.title)}》 ${esc(s.heading)}<br>${esc(s.text)}…</div>`
        ).join('');
      }
    }
  }
};
</script>
</body>
</html>
