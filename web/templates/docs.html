<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>房地产研报研判 · 报告库</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<nav class="topnav"><div class="topnav-in">
  <a class="logo" href="/">研报研判</a>
  <div class="navlinks">
    <a href="/">问答</a>
    <a href="/overview">总览</a>
    <a href="/metrics">指标看板</a>
    <a href="/docs" class="on" aria-current="page">报告库</a>
  </div>
</div></nav>
<main class="page">
<h2>报告库（{{docs|length}} 份）</h2>
<div class="doc-list">
{% for d in docs %}
<a class="doc-card" href="/docs/{{d.doc_id}}">
  <div class="doc-card-top">
    <span class="doc-inst">{{d.institution}}</span>
    <span class="doc-date">{{d.report_date}}</span>
  </div>
  <div class="doc-title">{{d.title}}</div>
  <div class="doc-meta">
    {% for c in d.cities %}<span class="tag">{{c}}</span>{% endfor %}
    <span class="doc-lang">{{d.lang}}</span>
  </div>
</a>
{% endfor %}
</div>
</main>
</body>
</html>
